[workspace]
resolver = "2"
members = [
    "crates/dwall",
    "crates/dwall-settings",
    "crates/logging",
    "crates/time",
]

[workspace.package]
authors = ["thep0y"]
version = "0.3.0-alpha.11"
# homepage = ""
repository = "https://github.com/dwall-rs/dwall"
license = "AGPL-3.0-only"
edition = "2024"

[workspace.dependencies]
dirs = { version = "7", default-features = false }
thiserror = { version = "2", default-features = false }
serde = { version = "1", default-features = false, features = [
    "std",
    "derive",
] }
serde_json = { version = "1", default-features = false, features = ["std"] }
# Version parsing for the update check: it compares the running version against the
# published ones, so ordinary semver ordering (pre-releases included) is required.
# Already in the tree through Tauri, so declaring it adds no second copy.
semver = "1"
log = { version = "0", default-features = false, features = ["std"] }
# Pinned to match Tauri. Declared here so every crate links the same version:
# a second copy doubles the generated bindings in the build and in the binary.
windows = { version = "0.62", default-features = false }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "z"
strip = true
