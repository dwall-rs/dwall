name: "Cache Warming"

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/*/Cargo.toml"
      - "package.json"
      - "bun.lockb"
  pull_request:
    types:
      - closed
    branches:
      - main
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/*/Cargo.toml"
      - "package.json"
      - "bun.lockb"
  workflow_dispatch:

  # The caches are keyed by the resolved toolchain, and a stable update changes that key
  # without touching any file the path filters watch. Without a periodic run the newest
  # caches would belong to the previous compiler, and every pull request would rebuild
  # everything from scratch.
  schedule:
    # Runs weekly on Monday at 05:00 UTC (13:00 Beijing time)
    - cron: "0 5 * * 1"

env:
  CARGO_INCREMENTAL: 0

jobs:
  warm-frontend-cache:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    name: "Warm Frontend Cache"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Cache frontend dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.bun
            node_modules/
          key: ${{ runner.os }}-frontend-${{ hashFiles('**/bun.lockb', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Install dependencies
        run: bun install --frozen-lockfile

  warm-rust-cache:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    name: "Warm Rust Cache"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        id: rust-toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Rust debug dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            target/debug/.fingerprint
            target/debug/deps
            target/debug/build
          key: ${{ runner.os }}-rust-debug-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-debug-${{ steps.rust-toolchain.outputs.cachekey }}-

      - name: Cache Rust release dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            target/release/.fingerprint
            target/release/deps
            target/release/build
          key: ${{ runner.os }}-rust-release-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-release-${{ steps.rust-toolchain.outputs.cachekey }}-

      - name: Create mock dwall.exe
        run: |
          New-Item -ItemType File -Path target/release/dwall.exe -Value "" -Force

      - name: Build caches
        run: |
          cargo fetch
          cargo build --tests
          cargo clippy --all-targets -- -D warnings
          cargo clippy -r --all-targets -- -D warnings
          cargo clippy -r -p dwall --features build-script,log-max-level-info --all-targets -- -D warnings
          cargo clippy -p dwall-settings --features log-max-level-info --all-targets -- -D warnings
