name: "PR Check"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
    paths:
      # Anything that can change what CI would have to say about a change belongs here:
      # a pull request that only touches the packaging templates or the release scripts
      # used to start no workflow at all, so its problems surfaced during a release.
      - ".github/**"
      - ".scripts/**"
      - ".packaging/**"
      - "docs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "src/**"
      - "package.json"
      - "bun.lockb"
      - "bunfig.toml"
      - "tsconfig.json"
      - "tsconfig.node.json"
      - "vite.config.ts"
      - "index.html"
      - "biome.json"
      - ".cargo/**"

env:
  CARGO_TERM_COLOR: always
  # Incremental data is not part of the cached paths, so it only makes the build
  # directory bigger (and prints a "could not be used" warning after a restore).
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # Detect the type of file changes
  detect-changes:
    name: "Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}
      workflow: ${{ steps.changes.outputs.workflow }}
      scripts: ${{ steps.changes.outputs.scripts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'package.json'
              - 'bun.lockb'
              - 'bunfig.toml'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - 'vite.config.ts'
              - 'index.html'
              - 'biome.json'
            backend:
              - "Cargo.toml"
              - "Cargo.lock"
              - "crates/**"
              - ".cargo/**"
            workflow:
              - '.github/**'
            scripts:
              - '.scripts/**'
              - '.packaging/**'

  frontend-check:
    name: "Frontend Code Check"
    runs-on: windows-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.workflow == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Cache frontend dependencies
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.bun
            node_modules/
          key: ${{ runner.os }}-frontend-${{ hashFiles('**/bun.lockb', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and lint
        run: bun run check

      - name: Run unit tests
        run: bun run test

      - name: Build frontend
        run: bun run build:vite

  # The release scripts and the package templates only run inside publish.yml, so a
  # mistake in them used to be discovered while a release was being cut.
  scripts-check:
    name: "Scripts Check"
    runs-on: windows-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.scripts == 'true' || needs.detect-changes.outputs.workflow == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check PowerShell syntax
        run: ./.scripts/check-powershell-syntax.ps1

      # Windows, because the winget schema validation only runs where the winget CLI is,
      # which is the same condition the release path sees.
      - name: Check the packaging templates still render
        run: ./.scripts/check-packaging-templates.ps1

  # A typo in a workflow is otherwise only noticed when it fails to run — a gate that
  # never fires because its `if:` names the wrong job looks exactly like a passing one.
  # The image is pinned by version and runs without the repository's token.
  workflow-lint:
    name: "Workflow Lint"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.workflow == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image bundles shellcheck, which actionlint runs over every `run:` block.
      # Only warnings and errors are gated: the release scripts deliberately rely on
      # word splitting (`for commit in $commits`) and repeated appends, which shellcheck
      # files as info/style. SC2155 — the warning class that caught masked return values
      # in nightly.yml — still fails.
      - name: Lint the workflows
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color -shellcheck 'shellcheck -S warning'

  rust-check:
    name: "Rust Code Check"
    runs-on: windows-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.workflow == 'true'
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        id: rust-toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Rust dependencies
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            target/debug/.fingerprint
            target/debug/deps
            target/debug/build
          key: ${{ runner.os }}-rust-debug-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          # The toolchain stays in the fallback prefix: artifacts built by another rustc are
          # unusable (cargo's fingerprints include it), so restoring them only costs a
          # 600 MB download. A toolchain update means one honest cold build instead.
          restore-keys: |
            ${{ runner.os }}-rust-debug-${{ steps.rust-toolchain.outputs.cachekey }}-

      # The release-profile lints below would otherwise recompile every dependency
      # on each pull request.
      - name: Cache Rust release dependencies
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            target/release/.fingerprint
            target/release/deps
            target/release/build
          key: ${{ runner.os }}-rust-release-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-release-${{ steps.rust-toolchain.outputs.cachekey }}-

      - name: Create mock dwall.exe
        run: |
          New-Item -ItemType File -Path target/release/dwall.exe -Value "" -Force

      - name: Cargo fmt check
        run: cargo fmt --all -- --check

      # `--all-targets` so test code is linted too, not only the libraries and binaries.
      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # `cfg(debug_assertions)` hides whole blocks from the debug pass, and
      # `log-max-level-info` compiles the debug!/trace! macros away, so the shipped
      # configuration has its own set of lints to fail.
      - name: Cargo clippy (release)
        run: cargo clippy -r --all-targets -- -D warnings

      - name: Cargo clippy (release, shipped features)
        run: cargo clippy -r -p dwall --features build-script,log-max-level-info --all-targets -- -D warnings

      # The settings crate is built by `tauri build --features log-max-level-info` too,
      # and that is the configuration where the debug!/trace! call sites disappear.
      - name: Cargo clippy (settings, shipped features)
        env:
          DWALL_SKIP_BUILD: 1
        run: cargo clippy -p dwall-settings --features log-max-level-info --all-targets -- -D warnings

      # The frontend compiles against src/ipc/bindings, which is generated from the Rust
      # types. Stale bindings type-check happily, so only regenerating them and looking
      # for a diff can tell.
      - name: Check generated bindings are up to date
        run: |
          cargo test -p dwall --features ts --lib export_bindings
          cargo test -p dwall-settings --features typegen export_bindings

          $stale = git status --porcelain -- src/ipc/bindings
          if ($stale) {
            Write-Host "::error::src/ipc/bindings is out of date; run 'bun run typegen' and commit the result"
            Write-Host $stale
            git --no-pager diff -- src/ipc/bindings
            exit 1
          }

      - name: Cargo test
        run: cargo test

      # The logging crate's own test target is not built by the daemon's run, so the
      # `max-level-info` gating test only ever runs here.
      - name: Cargo test (logging)
        run: cargo test -p logging --all-features

      # The root run uses the default feature set. The daemon ships with all of
      # them, and --all-features also regenerates src/ipc/bindings through the ts
      # feature, which the stale-bindings check above then re-verifies.
      - name: Cargo test (daemon, all features)
        run: cargo test -p dwall --all-features

      # The settings crate has no library target, so its tests live in the binary
      # and the per-crate form has to name --bins explicitly.
      - name: Cargo test (settings)
        env:
          DWALL_SKIP_BUILD: 1
        run: cargo test -p dwall-settings --bins

  auto-merge:
    name: Auto Merge PR
    runs-on: ubuntu-latest
    needs: [detect-changes, frontend-check, scripts-check, workflow-lint, rust-check]
    # Only merge when the change detection actually ran and no executed check
    # failed; a skipped check (nothing relevant changed) is acceptable, a failed
    # or cancelled one is not. Same-repository branches only: a pull request from a
    # fork gets a read-only token, so it could not merge even if it should.
    if: >-
      always() && !cancelled()
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.detect-changes.result == 'success'
      && (needs.frontend-check.result == 'success' || needs.frontend-check.result == 'skipped')
      && (needs.scripts-check.result == 'success' || needs.scripts-check.result == 'skipped')
      && (needs.workflow-lint.result == 'success' || needs.workflow-lint.result == 'skipped')
      && (needs.rust-check.result == 'success' || needs.rust-check.result == 'skipped')
    timeout-minutes: 10
    # `gh` reads the label with the repository token; the merge itself uses
    # `AUTOMERGE_TOKEN`, which is why no write scope is requested here.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The action below fails with "environment variable GITHUB_TOKEN not set!"
      # when the secret is empty, which says nothing about what to do. The label is
      # read through the API rather than from the payload, because a label added
      # after the run started is not in the payload while the action reads it live.
      - name: Check that the merge token is configured
        id: token
        env:
          TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number }}
          ACTOR: ${{ github.actor }}
          # There is no checkout in this job, so `gh` cannot infer the repository
          # from a remote; without this it fails before it reads a single label.
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The merge step is skipped rather than failed when the token is missing:
          # a workflow with nothing to merge with is not a failing check. A missing
          # token is only actionable when a person labelled the pull request, so
          # Dependabot runs say what to do instead of going red.
          if [[ -n "${TOKEN:-}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "present=false" >> "$GITHUB_OUTPUT"

          labels=$(gh pr view "${NUMBER}" --json labels --jq '.labels[].name') || {
            echo "::error::Could not read the labels of #${NUMBER}."
            exit 1
          }

          if ! grep -qx automerge <<< "${labels}"; then
            echo "::notice::#${NUMBER} has no automerge label, so the missing AUTOMERGE_TOKEN is not used here."
            exit 0
          fi

          if [[ "${ACTOR}" == "dependabot[bot]" ]]; then
            echo "::notice::This run was triggered by Dependabot, which never receives the repository secrets."
            echo "::notice::Store the token under Settings -> Secrets and variables -> Dependabot to merge these"
            echo "::notice::automatically, or add the label by hand: a label added by a person runs"
            echo "::notice::automerge-on-label.yml, which does receive it."
            exit 0
          fi

          echo "::error::AUTOMERGE_TOKEN is not set, so this labelled pull request cannot be merged."
          echo "::error::Create a fine-grained personal access token for this repository with"
          echo "::error::Contents, Pull requests and Workflows set to read and write, then store it:"
          echo "::error::  gh secret set AUTOMERGE_TOKEN --body <token>"
          exit 1

      - name: Auto merge PR
        if: steps.token.outputs.present == 'true'
        uses: pascalgn/automerge-action@7961b8b5eec56cc088c140b56d864285eabd3f67 # v0.16.4
        env:
          # `AUTOMERGE_TOKEN`, not `GITHUB_TOKEN`: GitHub starts no workflow for
          # the events the repository token causes, so a merge made with it would
          # leave `delete-merged-branch.yml` with nothing to hear and the branch
          # behind. See the comment above the job.
          GITHUB_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          MERGE_LABELS: "automerge"
          MERGE_REMOVE_LABELS: "automerge"
