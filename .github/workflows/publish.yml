name: "Bump new version"
on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type (prerelease only increments the pre-release number; alpha/beta only)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
      release_channel:
        description: "Release channel (alpha/beta are published as pre-releases)"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - alpha
          - beta

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Incremental data is not part of the cached paths; leaving it on only grows the build
  # directory (and prints a "could not be used" warning after a cache restore).
  CARGO_INCREMENTAL: 0

# Two release runs race over the same release branch, tag and GitHub release: the
# second force-pushes over the first while it is still uploading. Serialize them, and
# leave cancel-in-progress off so a queued run waits its turn instead of interrupting
# a run that is halfway through publishing.
concurrency:
  group: publish

jobs:
  pre-checks:
    runs-on: ubuntu-latest
    outputs:
      should_continue: ${{ steps.check.outputs.should_continue }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check if release is needed
        id: check
        run: |
          # Check for unreleased changes, excluding the nightly tag
          if git describe --tags --exact-match HEAD 2>/dev/null; then
            current_tag=$(git describe --tags --exact-match HEAD 2>/dev/null)
            if [[ "$current_tag" == "nightly" ]]; then
              echo "Current commit has nightly tag, proceeding with release"
              echo "should_continue=true" >> $GITHUB_OUTPUT
            else
              echo "Current commit is already tagged with $current_tag, skipping release"
              echo "should_continue=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "should_continue=true" >> $GITHUB_OUTPUT
          fi

  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: pre-checks
    if: always() && needs.pre-checks.outputs.should_continue == 'true'
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      # From a step output, not env.VERSION: a job-level output that reads env is
      # resolved before the bump step has written $GITHUB_ENV, so every later job saw
      # an empty version.
      package_version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.final_changelog.outputs.changelog }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Setup Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Bump version
        id: version
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          RELEASE_CHANNEL: ${{ github.event.inputs.release_channel }}
        run: |
          if [ "$RELEASE_CHANNEL" = "stable" ]; then
            if [ "$BUMP_TYPE" = "prerelease" ]; then
              echo "::error::bump_type 'prerelease' requires the alpha or beta channel"
              exit 1
            fi
            npm version "$BUMP_TYPE" --no-git-tag-version
          elif [ "$BUMP_TYPE" = "prerelease" ]; then
            # Bump only the pre-release number: 0.2.0-alpha.1 → 0.2.0-alpha.2 (base version untouched)
            npm version prerelease --preid "$RELEASE_CHANNEL" --no-git-tag-version
          else
            # Bump the base version and enter pre-release: 0.2.0 → 0.2.1-alpha.0
            npm version "pre$BUMP_TYPE" --preid "$RELEASE_CHANNEL" --no-git-tag-version
          fi
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          # Cargo.lock names the workspace members' versions too, so bumping only the
          # manifest leaves it stale: a build with --locked then fails with "cannot
          # update the lock file", and every checkout comes up dirty after the first
          # build. Refreshing the workspace packages leaves the dependency set alone.
          cargo update --workspace
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Bumping version to: $VERSION (channel: $RELEASE_CHANNEL)"

      - name: Create and push release branch
        run: |
          git checkout -b release
          git add package.json Cargo.toml Cargo.lock
          git commit -m "Bump version to ${{ env.VERSION }}"
          git push origin release --force

      - name: Determine changelog range
        id: changelog_range
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --exclude="nightly" refs/heads/main 2>/dev/null || echo "")

          if [ -n "$LAST_TAG" ] && git merge-base --is-ancestor "$LAST_TAG" refs/heads/main 2>/dev/null; then
            echo "fromTag=$LAST_TAG" >> $GITHUB_OUTPUT
            echo "Using tag $LAST_TAG as changelog base"
          else
            # Use main's root commit as the starting point
            ROOT_COMMIT=$(git rev-list --max-parents=0 refs/heads/main)
            echo "fromTag=$ROOT_COMMIT" >> $GITHUB_OUTPUT
            echo "No valid ancestor tag found, using root commit $ROOT_COMMIT"
          fi

      - name: Build changelog
        id: github_release_changelog
        uses: mikepenz/release-changelog-builder-action@32e3c96f29a6532607f638797455e9e98cfc703d # v4.2.2
        with:
          configuration: ".github/changelog-configuration.json"
          fromTag: ${{ steps.changelog_range.outputs.fromTag }}
          toTag: "refs/heads/main"
          failOnError: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fallback changelog from commits
        id: fallback_changelog
        if: steps.github_release_changelog.outputs.changelog == ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          FROM: ${{ steps.changelog_range.outputs.fromTag }}
        with:
          result-encoding: string
          script: |
            const { execSync } = require('child_process');

            const from = process.env.FROM;
            const log = execSync(`git log "${from}"..refs/heads/main --pretty=format:"%h %s %ae"`).toString().trim();

            const sections = {
              feat:     '🚀 Features',
              fix:      '🐛 Bug Fixes',
              perf:     '⚡ Performance',
              refactor: '♻️ Refactor',
              docs:     '📖 Documentation',
              chore:    '🔧 Chore',
              ci:       '👷 CI',
              test:     '🧪 Tests',
              style:     '🎨 Styles',
            };
            const order = Object.keys(sections);
            const buckets = {};

            for (const line of log.split('\n').filter(Boolean)) {
              const parts = line.split(' ');
              const sha = parts[0];
              const msg = parts.slice(1, -1).join(' ');
              const match = msg.match(/^([a-z]+)[\(:!]/);
              const prefix = match ? match[1] : 'other';
              const key = order.includes(prefix) ? prefix : 'other';
              buckets[key] = buckets[key] || [];
              buckets[key].push(`- ${msg}`);
            }

            let changelog = '';
            for (const prefix of order) {
              if (buckets[prefix]?.length) {
                changelog += `## ${sections[prefix]}\n${buckets[prefix].join('\n')}\n\n`;
              }
            }
            if (!changelog) changelog = 'No changes recorded.';

            core.setOutput('changelog', changelog);

      - name: Set final changelog
        id: final_changelog
        run: |
          {
            echo "changelog<<EOF"
            echo "${{ steps.github_release_changelog.outputs.changelog != '' && steps.github_release_changelog.outputs.changelog || steps.fallback_changelog.outputs.changelog }}"
            echo ""
            echo "### Downloads"
            echo ""
            echo "- \`Dwall.Settings_${VERSION}_x64-setup.exe\` — settings window, with the daemon bundled in"
            echo "- \`Dwall_${VERSION}_x64-daemon.zip\` — the daemon alone: portable, headless, no WebView2 (see \`docs/headless.md\`)"
            echo ""
            echo "Both are listed with their \`.sha256\`; the updater metadata is \`latest.json\`."
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create release
        id: create-release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          changelog: ${{ steps.final_changelog.outputs.changelog }}
          PRERELEASE: ${{ github.event.inputs.release_channel != 'stable' }}
        with:
          retries: 3
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${process.env.VERSION}`,
              name: `v${process.env.VERSION}`,
              body: process.env.changelog,
              draft: true,
              prerelease: process.env.PRERELEASE === 'true'
            })
            return data.id

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    runs-on: windows-latest

    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Cache frontend dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.bun
            node_modules/
          key: ${{ runner.os }}-frontend-${{ hashFiles('**/bun.lockb', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Install Rust stable
        id: rust-toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Rust dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            target/release/.fingerprint
            target/release/deps
            target/release/build
          key: ${{ runner.os }}-rust-release-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-release-${{ steps.rust-toolchain.outputs.cachekey }}-

      - name: Setup Biome CLI
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome check
        run: bun run check

      - name: Build application
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseBody: ${{ needs.create-release.outputs.changelog }}
          updaterJsonPreferNsis: true
          args: --features log-max-level-info

      # The same daemon the installer bundles, published on its own for portable
      # and headless installs; the GUI and its WebView2 requirement stay out.
      - name: Package the standalone daemon
        run: ./.scripts/package-daemon.ps1 -Version "${{ needs.create-release.outputs.package_version }}"

      - name: Attach the standalone daemon to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.package_version }}
        run: gh release upload "v${VERSION}" dist-daemon/*.zip dist-daemon/*.zip.sha256 --clobber

      # Rendered here so a stale template or a missing checksum surfaces during the
      # release instead of halfway through a winget or Scoop submission. Run the
      # same script with -Validate locally (`winget validate` is not guaranteed to
      # exist on a runner). Stable channel only: a pre-release is dropped as soon as
      # the next one exists, so a manifest rendered from it would point at nothing.
      - name: Render the winget and Scoop manifests
        if: ${{ github.event.inputs.release_channel == 'stable' }}
        run: ./.scripts/render-package-manifests.ps1 -Version "${{ needs.create-release.outputs.package_version }}"

  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri]
    if: success()

    steps:
      - name: Publish release
        id: publish-release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
          PACKAGE_VERSION: ${{ needs.create-release.outputs.package_version }}
        with:
          retries: 3
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
            })

      # A pre-release is a one-off test build: the updater only ever offers the newest one,
      # and an older installer left on the releases page is something people install by
      # mistake. Tags are kept, so any dropped build stays reproducible from source.
      - name: Drop older pre-releases
        if: ${{ github.event.inputs.release_channel != 'stable' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_TAG: v${{ needs.create-release.outputs.package_version }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 \
            --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName' |
          while read -r tag; do
            if [ -z "$tag" ] || [ "$tag" = "$KEEP_TAG" ]; then
              continue
            fi
            echo "Dropping the older pre-release $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          done

      - name: Create release summary
        run: |
          echo "## 🎉 Release Published Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ needs.create-release.outputs.package_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release ID:** ${{ needs.create-release.outputs.release_id }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Release](https://github.com/${{ github.repository }}/releases/tag/v${{ needs.create-release.outputs.package_version }})" >> $GITHUB_STEP_SUMMARY

  update-main-version:
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: success()

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Update main version
        run: |
          git fetch origin release:release
          git checkout main
          git merge release --ff-only
          git push origin main
        continue-on-error: false

  cleanup-release-branch:
    needs: update-main-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: success()
    steps:
      - name: Delete release branch
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/release'
              })
              console.log('Release branch deleted successfully')
            } catch (error) {
              console.log('Failed to delete release branch:', error.message)
              // Don't let this failure block the whole workflow
            }

  # Without a dependency this job starts the moment the workflow does, because
  # success() is already true when nothing precedes it: it deleted the nightly release
  # and tag while the build and upload were still running, racing nightly.yml over the
  # same tag. It has to follow the release it exists to supersede.
  delete-nightly-release-and-tag:
    needs: publish-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: success()

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Delete old nightly release
        run: |
          # Check whether a nightly release exists
          if gh release view nightly >/dev/null 2>&1; then
            echo "Deleting existing nightly release..."
            gh release delete nightly --cleanup-tag --yes
            echo "Nightly release deleted successfully"
          else
            echo "No nightly release found, skipping deletion"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  notify-completion:
    runs-on: ubuntu-latest
    needs:
      [
        create-release,
        build-tauri,
        publish-release,
        update-main-version,
        delete-nightly-release-and-tag,
      ]
    if: always()
    steps:
      - name: Create workflow summary
        run: |
          echo "## 🚀 Release Workflow Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.create-release.outputs.package_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Bump type:** ${{ github.event.inputs.bump_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release channel:** ${{ github.event.inputs.release_channel }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.publish-release.result }}" == "success" ]]; then
            echo "✅ **Release published successfully!**" >> $GITHUB_STEP_SUMMARY
            echo "[View Release](https://github.com/${{ github.repository }}/releases/tag/v${{ needs.create-release.outputs.package_version }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Release failed or was cancelled**" >> $GITHUB_STEP_SUMMARY
          fi

          # The release is already public at this point, so a failed fast-forward is
          # not a failed release — but it does leave main on the previous version,
          # and the summary used to report success without a word about it.
          if [[ "${{ needs.publish-release.result }}" == "success" && "${{ needs.update-main-version.result }}" != "success" ]]; then
            echo "::warning::The release is public but main was not moved to it"
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **main still points at the previous version** — update-main-version reported ${{ needs.update-main-version.result }}." >> $GITHUB_STEP_SUMMARY
            echo "The release is public, but the version bump is not on main; move it by hand or re-run that job." >> $GITHUB_STEP_SUMMARY
          fi
