version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"

  # Every action is pinned to a commit, so without this nothing would ever offer a
  # newer one.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
