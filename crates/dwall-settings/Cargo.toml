[package]
name = "dwall-settings"
description = "Dwall settings"
edition.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = [
    "protocol-asset",
    "wry",
    "compression",
] }
dwall = { path = "../dwall" }
log = { workspace = true, default-features = false, features = ["std"] }
logging = { path = "../logging" }
time = { path = "../time" }
# `native-tls` is spelled out even though `tauri-plugin-updater` also enables it:
# relying on that transitive feature is what silently removes TLS if the plugin
# set ever changes.
reqwest = { version = "0", default-features = false, features = [
    "socks",
    "native-tls",
] }
zip = { version = "9", default-features = false, features = ["deflate"] }
open = { version = "5", default-features = false }
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt-multi-thread",
    "fs",
    "sync",
    "time",
    "io-util",
] }
dirs = { workspace = true, default-features = false }
serde = { workspace = true }
serde_json = { workspace = true, default-features = false }
semver = { workspace = true }
thiserror = { workspace = true, default-features = false }
ts-rs = { version = "12", optional = true, default-features = false, features = [
    "serde-compat",
    "no-serde-warnings",
] }
rand = { version = "0.10", default-features = false, features = ["thread_rng"] }
toml = { version = "1", default-features = false, features = ["parse"] }

tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = [
    "native-tls",
    "zip",
] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_System_Registry",
    "Win32_System_Diagnostics_ToolHelp",
    # `ProcessIdToSessionId`: the daemon's mutex is session-local, so the process the
    # settings app may stop is the one in its own session.
    "Win32_System_RemoteDesktop",
    "Win32_System_ProcessStatus",
    "Win32_Graphics_Dwm",
    "Wdk_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_Globalization",
    "Win32_System_Threading",
] }

[features]
default = []
devtools = ["tauri/devtools"]
log-max-level-info = ["logging/max-level-info"]
typegen = ["dep:ts-rs", "dwall/ts"]
