[package]
name = "dwall"
description = "Dwall daemon"
exclude = ["CHANGELOG.md", "/target"]
readme = "README.md"
version.workspace = true
edition.workspace = true
# Let-chains (`if let ... && ...`) need 1.88; `u16::is_multiple_of` needs 1.87.
rust-version = "1.88"
# homepage.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "dwall"
path = "src/bin/daemon.rs"

[build-dependencies]
tauri-winres = { version = "0", optional = true }

[dependencies]
time = { path = "../time" }
log = { workspace = true, default-features = false, features = ["std"] }
logging = { path = "../logging" }
toml = { version = "1", default-features = false, features = [
    "display",
    "parse",
    "serde",
] }
dirs = { workspace = true, default-features = false }
serde = { workspace = true, default-features = false }
serde_json = { workspace = true, default-features = false }
thiserror = { workspace = true, default-features = false }
ts-rs = { version = "12", optional = true, default-features = false, features = [
    "serde-compat",
    "no-serde-warnings",
] }

[target.'cfg(windows)'.dependencies]
# Keep version in sync with tauri (declared in the workspace root)
windows = { workspace = true, features = [
    "std",
    "Devices_Geolocation",
    "System_UserProfile",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_Devices_Display",
    "Win32_Devices_DeviceAndDriverInstallation",
] }
# The WinRT async types (`IAsyncOperation`, `AsyncStatus`, …) live in this crate and
# are not re-exported by `windows`. It is already in the dependency tree via
# `windows`; naming it directly is what lets us wait on those operations with a
# timeout instead of the `INFINITE` wait inside `windows-future`'s blocking helpers.
windows-future = { version = "0.100", default-features = false }


[dev-dependencies]
mockall = "0"
insta = { version = "1", features = ["json", "redactions"] }
proptest = "1"

[features]
default = []
build-script = ["tauri-winres"]
log-max-level-info = ["logging/max-level-info"]
ts = ["dep:ts-rs"]
